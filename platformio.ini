; ShakeMeter - ESP32-C3 Super Mini + MPU-6050 + 80x WS2812B
; Vibration "VU meter": light shakes light LED 1, big shakes reach LED 80.

[env:esp32c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The Super Mini has no USB-UART chip; Serial goes over the C3's native USB.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    fastled/FastLED@3.7.8
